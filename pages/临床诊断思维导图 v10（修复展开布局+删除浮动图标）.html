<div class="header">

<div class="disclaimer">

<div class="toolbar">

  </div>
  <div class="search-row">
    <input id="search" class="search-box" placeholder="搜索：如 头痛 / 胸痛 / 糖尿病 / 咳嗽…">
  </div>
</div>

<div class="sort-hint">搜索时结果按【紧急 → 警惕 → 常见 → 大类】排序，自动展开匹配项。</div>

<div class="legend">
  <span class="lg-system">系统/大类</span>
  <span class="lg-common">常见良性</span>

<div id="resultCount" class="result-count"></div>
<div id="tree" class="tree"></div>
<div id="redgrid" class="redgrid hidden"></div>

  <div id="mindmap" style="width:100%;height:100%;"></div>
</div>

// ============ 渲染逻辑 ============
const treeEl = document.getElementById('tree');
const redgridEl = document.getElementById('redgrid');
const mindmapEl = document.getElementById('mindmap');
const mindmapWrapEl = document.getElementById('mindmapWrap');
const searchEl = document.getElementById('search');
const resultCountEl = document.getElementById('resultCount');
const tabBtns = document.querySelectorAll('.tab');
let currentView = 'byBody';

const TYPE_LABEL = {
  system: ['大类', 'tag-system', 3],
  common: ['常见', 'tag-common', 2],
  caution: ['警惕', 'tag-caution', 1],
  red:    ['紧急', 'tag-red', 0],
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, kw) {
  if (!kw) return escapeHtml(text);
  const safe = escapeHtml(text);
  const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return safe.replace(re, m => '<span class="highlight">' + m + '</span>');
}

// 递归收集所有叶节点（含上下文路径）
function collectLeaves(nodes, path, out) {
  path = path || [];
  out = out || [];
  nodes.forEach(n => {
    const curPath = path.concat([n.t]);
    if (n.children && n.children.length) {
      collectLeaves(n.children, curPath, out);
    } else {
      out.push({ node: n, path: curPath });
    }
  });
  return out;
}

// 判断节点是否匹配关键词
function nodeMatches(n, kw) {
  const hay = [n.t, n.d || '', n.chk || '', n.tx || '', n.rf || ''].join(' ');
  return hay.toLowerCase().indexOf(kw.toLowerCase()) >= 0;
}

function renderLeafCard(item, kw) {
  const n = item.node;
  const cls = n.type || 'system';
  const pair = TYPE_LABEL[cls] || TYPE_LABEL.system;
  const pathStr = item.path.slice(0, -1).join(' › ');

  let html = '<div class="node-row" style="margin-bottom:4px;">' +
    '<span class="caret">•</span>' +
    '<div class="node-body">' +
      '<div class="node-title">' + highlight(n.t, kw) +
        '<span class="node-tag ' + pair[1] + '">' + pair[0] + '</span>' +
        (n.prob ? '<span class="node-prob">人群：' + escapeHtml(n.prob) + '</span>' : '') +
      '</div>' +
      '<div class="node-desc" style="color:#8aa0b5;font-size:11px;">' + escapeHtml(pathStr) + '</div>' +
      (n.d ? '<div class="node-desc">' + highlight(n.d, kw) + '</div>' : '') +
      (n.chk ? '<div class="node-meta"><b>首选检查：</b>' + escapeHtml(n.chk) + '</div>' : '') +
      (n.tx ? '<div class="node-tx"><b>治疗流程：</b>' + escapeHtml(n.tx) + '</div>' : '') +
      (n.rf ? '<div class="node-redflag">⚠ ' + escapeHtml(n.rf) + '</div>' : '') +
    '</div>' +
  '</div>';
  return html;
}

function renderSearchResults(data, kw) {
  const all = collectLeaves(data);
  const matched = all.filter(item => nodeMatches(item.node, kw));
  // 按紧急度排序 red(0) < caution(1) < common(2) < system(3)
  matched.sort((a, b) => {
    const sa = TYPE_LABEL[a.node.type || 'system'][2];
    const sb = TYPE_LABEL[b.node.type || 'system'][2];
    if (sa !== sb) return sa - sb;
    return a.node.t.localeCompare(b.node.t, 'zh');
  });
  resultCountEl.textContent = '共匹配 ' + matched.length + ' 项，按【紧急 → 警惕 → 常见】排序';
  if (matched.length === 0) {
    treeEl.innerHTML = '<div style="padding:20px;color:#8aa0b5;text-align:center;">未找到匹配项，换个关键词试试</div>';
    return;
  }
  treeEl.innerHTML = matched.map(item => renderLeafCard(item, kw)).join('');
}

function renderTreeNode(node, kw) {
  const hasChildren = node.children && node.children.length;
  const cls = node.type || 'system';
  const pair = TYPE_LABEL[cls] || TYPE_LABEL.system;

  let inner = '';
  if (hasChildren) {
    inner = '<ul class="children">' +
      node.children.map(c => renderTreeNode(c, kw)).join('') +
      '</ul>';
  }

  let metaHtml = '';
  if (node.chk) metaHtml = '<div class="node-meta"><b>首选检查：</b>' + escapeHtml(node.chk) + '</div>';
  let probHtml = node.prob ? '<span class="node-prob">人群：' + escapeHtml(node.prob) + '</span>' : '';
  let txHtml = node.tx ? '<div class="node-tx"><b>治疗流程：</b>' + escapeHtml(node.tx) + '</div>' : '';
  let rfHtml = node.rf ? '<div class="node-redflag">⚠ ' + escapeHtml(node.rf) + '</div>' : '';

  return '<li class="node ' + (hasChildren ? '' : 'leaf') + '">' +
    '<div class="node-row">' +
      '<span class="caret">▶</span>' +
      '<div class="node-body">' +
        '<div class="node-title">' + highlight(node.t, kw) +
          '<span class="node-tag ' + pair[1] + '">' + pair[0] + '</span>' + probHtml +
        '</div>' +
        (node.d ? '<div class="node-desc">' + highlight(node.d, kw) + '</div>' : '') +
        metaHtml + txHtml + rfHtml +
      '</div>' +
    '</div>' +
    inner +
  '</li>';
}

function renderTree(data, kw) {
  treeEl.innerHTML = '<ul class="tree">' + data.map(n => renderTreeNode(n, kw)).join('') + '</ul>';
  treeEl.querySelectorAll('.node-row').forEach(row => {
    row.addEventListener('click', () => {
      const li = row.parentElement;
      if (li.classList.contains('leaf')) return;
      li.classList.toggle('expanded');
    });
  });
}

function renderRedGrid() {
  redgridEl.innerHTML = RED_FLAGS.map(r =>
    '<div class="red-card">' +
      '<div class="rt">' + escapeHtml(r.t) + '</div>' +
      '<div class="rd">' + escapeHtml(r.d) + '</div>' +
      '<div class="ra">→ ' + escapeHtml(r.a) + '</div>' +
    '</div>'
  ).join('');
}

function setView(view) {
  currentView = view;
  tabBtns.forEach(b => b.classList.toggle('active', b.dataset.view === view));
  const kw = (searchEl.value || '').trim();
  if (view === 'redFlag') {
    treeEl.classList.add('hidden');
    resultCountEl.textContent = '';
    redgridEl.classList.remove('hidden');
    renderRedGrid();
    mindmapWrapEl.classList.add('hidden');
    return;
  }
  redgridEl.classList.add('hidden');
  if (view === 'mindmap') {
    treeEl.classList.add('hidden');
    resultCountEl.textContent = '';
    mindmapWrapEl.classList.remove('hidden');
    renderMindmap();
    return;
  }
  mindmapWrapEl.classList.add('hidden');
  treeEl.classList.remove('hidden');
  let data;
  if (view === 'byBody') data = BY_BODY;
  else if (view === 'bySymptom') data = BY_SYMPTOM;
  else if (view === 'byCheck') data = CHECKS_DATA;
  else if (view === 'byDrug') data = DRUGS_DATA;
  else if (view === 'emergency') data = EMERGENCY_DATA;
  else data = BY_BODY;
  if (kw) {
    renderSearchResults(data, kw);
  } else {
    resultCountEl.textContent = '';
    renderTree(data, kw);
    treeEl.querySelectorAll(':scope > ul.tree > li.node').forEach(top => {
      if (top.querySelector(':scope > .children')) top.classList.add('expanded');
    });
  }
  if (typeof updateFabState === 'function') updateFabState();
}

  return nodes.map(n => {

    }
    return item;
  });
}

      {
        name: '按症状', itemStyle: { color: '#27ae60' },
        children: toEChartsTree(BY_SYMPTOM, '#27ae60')
      },
      {
        name: '检查项目', itemStyle: { color: '#8e44ad' },
        children: toEChartsTree(CHECKS_DATA, '#8e44ad')
      },
      {
        name: '常用药品', itemStyle: { color: '#16a085' },
        children: toEChartsTree(DRUGS_DATA, '#16a085')
      },
      {
        name: '急危重', itemStyle: { color: '#c0392b' },
        children: toEChartsTree(EMERGENCY_DATA, '#c0392b')
      },
    ]
  };
}
function setCollapsedAll(node, collapsed) {
  if (node.children && node.children.length) {
    node.collapsed = collapsed;
    node.children.forEach(c => setCollapsedAll(c, collapsed));
  }
}
function renderMindmap() {
  if (!mindmapEl) return;
  if (!mindmapChart) {
    mindmapChart = echarts.init(mindmapEl);
    window.addEventListener('resize', () => mindmapChart && mindmapChart.resize());
  }
  const data = buildMindmapData();
  const option = {
    tooltip: { trigger: 'item', triggerOn: 'mousemove' },
    series: [{
      type: 'tree',
      data: [data],
      top: '4%', left: '8%', bottom: '2%', right: '20%',
      symbolSize: 9,
      orient: 'LR',
      label: {
        position: 'left', verticalAlign: 'middle', align: 'right',
        fontSize: 12, color: '#1f2d3d'
      },
      leaves: {
        label: {
          position: 'right', verticalAlign: 'middle', align: 'left',
          fontSize: 11, color: '#4a6076'
        }
      },
      expandAndCollapse: true,
      initialTreeDepth: 2,
      animationDuration: 300,
      lineStyle: { color: '#b8c5d1', width: 1 },
      emphasis: { focus: 'descendant' },
      roam: true,
      draggable: true
    }]
  };
  mindmapChart.setOption(option);
  setTimeout(() => mindmapChart.resize(), 50);
}

tabBtns.forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
searchEl.addEventListener('input', () => setView(currentView));

renderRedGrid();

// 思维导图工具栏按钮（全局，供 onclick 调用）
function mmExpandAll() {
  const d = buildMindmapData();
  setCollapsedAll(d, false);
  if (mindmapChart) {
    mindmapChart.setOption({
      series: [{
        data: [d],
        right: '25%',
        symbolSize: 6,
        label: { fontSize: 10 },
        leaves: { label: { fontSize: 9 } }
      }]
    });
  }
}
function mmCollapseAll() {
  const d = buildMindmapData();
  d.children.forEach(top => {
    if (top.children && top.children.length) {
      top.collapsed = false;
      top.children.forEach(sub => {
        if (sub.children && sub.children.length) sub.collapsed = true;
      });
    }
  });
  if (mindmapChart) {
    mindmapChart.setOption({
      series: [{
        data: [d],
        right: '20%',
        symbolSize: 9,
        label: { fontSize: 12 },
        leaves: { label: { fontSize: 11 } }
      }]
    });
  }
}

setView('byBody');
</script>
